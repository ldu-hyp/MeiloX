name: Build Android 16 Immersive Test APK

on:
  push:
    branches:
      - fix/android16-landscape-immersive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 37.0 and native toolchain
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Assemble separately installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug -Pmei.applicationId=com.neoruaa.meilox.immersive

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MeiloX-Android16-Immersive-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
